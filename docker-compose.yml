services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: job_hunter
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
